name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fivediamonds
          POSTGRES_PASSWORD: fivediamonds_dev_only
          POSTGRES_DB: fivediamonds
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U fivediamonds" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://fivediamonds:fivediamonds_dev_only@localhost:5442/fivediamonds
      TEST_DATABASE_URL: postgres://fivediamonds:fivediamonds_dev_only@localhost:5442/fivediamonds_test
      AUTH_SECRET: ci-only-secret-ci-only-secret-0123456789
      APP_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: psql postgres://fivediamonds:fivediamonds_dev_only@localhost:5442/fivediamonds -c "CREATE DATABASE fivediamonds_test"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx --workspace @fd/web playwright install --with-deps chromium
      - run: cp .env.example .env && sed -i "s|AUTH_SECRET=.*|AUTH_SECRET=$AUTH_SECRET|" .env
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
